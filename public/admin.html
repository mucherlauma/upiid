<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#f4f7fb;
    color:#222;
}

.header{
    background:#243b64;
    color:white;
    padding:20px 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.header h1{
    font-size:24px;
}

.admin-name{
    background:rgba(255,255,255,.15);
    padding:10px 16px;
    border-radius:10px;
    font-size:14px;
}

.container{
    max-width:1200px;
    margin:30px auto;
    padding:0 20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    padding:22px;
    border-radius:16px;
    box-shadow:0 8px 25px rgba(0,0,0,.07);
}

.stat-card p{
    color:#777;
    font-size:14px;
    margin-bottom:8px;
}

.stat-card h2{
    color:#243b64;
    font-size:28px;
}

.pending{
    color:#d18a00 !important;
}

.approved{
    color:#219653 !important;
}

.rejected{
    color:#d63031 !important;
}

.panel{
    background:white;
    border-radius:18px;
    padding:25px;
    box-shadow:0 8px 25px rgba(0,0,0,.07);
}

.panel-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.panel-top h2{
    color:#243b64;
}

.refresh-btn{
    border:none;
    background:#243b64;
    color:white;
    padding:10px 18px;
    border-radius:9px;
    cursor:pointer;
}

.table-container{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th{
    background:#f4f7fb;
    color:#555;
    padding:14px;
    text-align:left;
    font-size:13px;
}

td{
    padding:14px;
    border-bottom:1px solid #eee;
    font-size:14px;
}

.status{
    display:inline-block;
    padding:6px 11px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.status-pending{
    background:#fff4d6;
    color:#9a6700;
}

.status-approved{
    background:#e7f8ed;
    color:#218739;
}

.status-rejected{
    background:#ffe8e8;
    color:#c62828;
}

.actions{
    display:flex;
    gap:8px;
}

.approve-btn,
.reject-btn{
    border:none;
    padding:8px 12px;
    border-radius:7px;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
}

.approve-btn{
    background:#219653;
    color:white;
}

.reject-btn{
    background:#d63031;
    color:white;
}

.disabled-btn{
    background:#ddd;
    color:#777;
    cursor:not-allowed;
    border:none;
    padding:8px 12px;
    border-radius:7px;
}

.loading{
    text-align:center;
    padding:30px;
    color:#777;
}

.empty{
    text-align:center;
    padding:40px;
    color:#888;
}

.message{
    margin-bottom:15px;
    padding:12px;
    border-radius:10px;
    display:none;
}

.message.success{
    display:block;
    background:#e7f8ed;
    color:#218739;
}

.message.error{
    display:block;
    background:#ffe8e8;
    color:#c62828;
}

@media(max-width:800px){

    .header{
        padding:16px 20px;
    }

    .header h1{
        font-size:20px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .container{
        margin:20px auto;
        padding:0 12px;
    }

    .panel{
        padding:18px;
    }
}

@media(max-width:500px){

    .stats{
        grid-template-columns:1fr;
    }

    .header{
        flex-direction:column;
        gap:12px;
        align-items:flex-start;
    }
}
</style>
</head>

<body>

<div class="header">

    <h1>Admin Payment Panel</h1>

    <div class="admin-name">
        Admin
    </div>

</div>

<div class="container">

    <div class="stats">

        <div class="stat-card">
            <p>Total Payments</p>
            <h2 id="totalCount">0</h2>
        </div>

        <div class="stat-card">
            <p>Pending</p>
            <h2 class="pending" id="pendingCount">0</h2>
        </div>

        <div class="stat-card">
            <p>Approved</p>
            <h2 class="approved" id="approvedCount">0</h2>
        </div>

        <div class="stat-card">
            <p>Rejected</p>
            <h2 class="rejected" id="rejectedCount">0</h2>
        </div>

    </div>

    <div id="message" class="message"></div>

    <div class="panel">

        <div class="panel-top">

            <h2>Payment Requests</h2>

            <button
                class="refresh-btn"
                onclick="loadPayments()"
            >
                Refresh
            </button>

        </div>

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Transaction ID</th>
                        <th>UPI ID</th>
                        <th>Amount</th>
                        <th>Method</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="paymentTable">

                    <tr>
                        <td colspan="8" class="loading">
                            Loading payments...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

const API_URL =
    "https://upi-payment-website-rqfe.onrender.com";


async function loadPayments(){

    const table =
        document.getElementById(
            "paymentTable"
        );

    table.innerHTML =
        `<tr>
            <td colspan="8" class="loading">
                Loading payments...
            </td>
        </tr>`;


    try{

        const response =
            await fetch(
                API_URL +
                "/api/admin/payments"
            );


        if(!response.ok){

            throw new Error(
                "Server error"
            );

        }


        const data =
            await response.json();


        if(!data.success){

            throw new Error(
                data.message ||
                "Payments load failed"
            );

        }


        updateStats(
            data.payments
        );


        if(
            !data.payments ||
            data.payments.length === 0
        ){

            table.innerHTML =
                `<tr>
                    <td colspan="8" class="empty">
                        No payments found
                    </td>
                </tr>`;

            return;

        }


        table.innerHTML =
            data.payments
            .map(payment => {

                const status =
                    payment.status ||
                    "PENDING";


                let statusClass =
                    "status-pending";


                if(status === "APPROVED"){
                    statusClass =
                        "status-approved";
                }


                if(status === "REJECTED"){
                    statusClass =
                        "status-rejected";
                }


                let actions = "";


                if(status === "PENDING"){

                    actions = `
                        <div class="actions">

                            <button
                                class="approve-btn"
                                onclick="updatePayment(
                                    '${payment.transaction_id}',
                                    'APPROVED'
                                )"
                            >
                                Approve
                            </button>

                            <button
                                class="reject-btn"
                                onclick="updatePayment(
                                    '${payment.transaction_id}',
                                    'REJECTED'
                                )"
                            >
                                Reject
                            </button>

                        </div>
                    `;

                }
                else{

                    actions =
                        `<button
                            class="disabled-btn"
                            disabled
                        >
                            Completed
                        </button>`;

                }


                return `

                    <tr>

                        <td>
                            ${payment.id}
                        </td>

                        <td>
                            ${payment.transaction_id}
                        </td>

                        <td>
                            ${payment.upi_id}
                        </td>

                        <td>
                            ₹${payment.amount}
                        </td>

                        <td>
                            ${payment.payment_method}
                        </td>

                        <td>

                            <span
                                class="status ${statusClass}"
                            >
                                ${status}
                            </span>

                        </td>

                        <td>
                            ${formatDate(
                                payment.created_at
                            )}
                        </td>

                        <td>
                            ${actions}
                        </td>

                    </tr>

                `;

            })
            .join("");


    }
    catch(error){

        console.error(error);

        table.innerHTML =
            `<tr>
                <td colspan="8" class="empty">
                    Payments load avvaledu.
                </td>
            </tr>`;

        showMessage(
            "Payments load avvaledu.",
            "error"
        );

    }

}


function updateStats(payments){

    const total =
        payments.length;


    const pending =
        payments.filter(
            p => p.status === "PENDING"
        ).length;


    const approved =
        payments.filter(
            p => p.status === "APPROVED"
        ).length;


    const rejected =
        payments.filter(
            p => p.status === "REJECTED"
        ).length;


    document.getElementById(
        "totalCount"
    ).innerText = total;


    document.getElementById(
        "pendingCount"
    ).innerText = pending;


    document.getElementById(
        "approvedCount"
    ).innerText = approved;


    document.getElementById(
        "rejectedCount"
    ).innerText = rejected;

}


async function updatePayment(
    transactionId,
    status
){

    const action =
        status === "APPROVED"
            ? "approve"
            : "reject";


    const confirmation =
        confirm(
            "Are you sure you want to " +
            action +
            " this payment?"
        );


    if(!confirmation){
        return;
    }


    try{

        const response =
            await fetch(
                API_URL +
                "/api/admin/payment/" +
                encodeURIComponent(
                    transactionId
                ),
                {
                    method:"PUT",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({
                        status:status
                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok ||
            !data.success){

            throw new Error(
                data.message ||
                "Update failed"
            );

        }


        showMessage(
            "Payment " +
            status.toLowerCase() +
            " successfully.",
            "success"
        );


        loadPayments();

    }
    catch(error){

        console.error(error);

        showMessage(
            "Payment update avvaledu.",
            "error"
        );

    }

}


function formatDate(date){

    if(!date){
        return "-";
    }


    return new Date(date)
        .toLocaleString(
            "en-IN"
        );

}


function showMessage(
    message,
    type
){

    const element =
        document.getElementById(
            "message"
        );


    element.innerText =
        message;


    element.className =
        "message " + type;


    setTimeout(() => {

        element.className =
            "message";

    },3000);

}


loadPayments();

setInterval(
    loadPayments,
    10000
);

</script>

</body>
</html>
