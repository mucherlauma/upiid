<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
            padding: 20px;
        }

        .payment-container {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 22px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #243b64;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .amount-box {
            background: #f5f7fb;
            padding: 18px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 25px;
        }

        .amount-box p {
            color: #777;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .amount-box h2 {
            color: #243b64;
            font-size: 30px;
        }

        .pay-title {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            margin-bottom: 12px;
        }

        .payment-card {
            width: 100%;
            display: flex;
            align-items: center;
            padding: 16px;
            margin-bottom: 14px;
            background: #ffffff;
            border: 1px solid #e1e5eb;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.25s;
        }

        .payment-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.10);
        }

        .payment-card:active {
            transform: scale(0.97);
        }

        .logo {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .phonepe-logo {
            background: #5f259f;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .paytm-logo {
            background: #eaf8ff;
            color: #009de0;
            font-size: 18px;
            font-weight: bold;
        }

        .payment-info {
            flex: 1;
        }

        .payment-info h3 {
            color: #222;
            font-size: 17px;
            margin-bottom: 5px;
        }

        .payment-info p {
            color: #888;
            font-size: 12px;
        }

        .arrow {
            font-size: 28px;
            color: #aaa;
        }

        .secure {
            text-align: center;
            color: #777;
            font-size: 12px;
            margin-top: 18px;
        }

        .qr-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .qr-box {
            width: 100%;
            max-width: 360px;
            background: white;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
        }

        .qr-box h2 {
            color: #243b64;
            margin-bottom: 8px;
        }

        .qr-box p {
            color: #777;
            font-size: 13px;
            margin-bottom: 15px;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }

        #qrcode img {
            width: 220px;
            height: 220px;
        }

        .upi-id {
            background: #f5f7fb;
            padding: 11px;
            border-radius: 9px;
            color: #333;
            font-size: 13px;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .copy-btn {
            width: 100%;
            border: none;
            padding: 13px;
            border-radius: 10px;
            background: #243b64;
            color: white;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .close-btn {
            width: 100%;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 10px;
            background: white;
            color: #555;
            font-size: 14px;
            cursor: pointer;
        }

        @media (max-width: 450px) {

            body {
                padding: 12px;
            }

            .payment-container {
                padding: 25px 18px;
            }

        }

    </style>

</head>

<body>

    <div class="payment-container">

        <h1>Choose Payment</h1>

        <p class="subtitle">
            Select your preferred payment method
        </p>

        <div class="amount-box">

            <p>Amount to Pay</p>

            <h2 id="amountDisplay">
                ₹500
            </h2>

        </div>

        <div class="pay-title">
            Pay Using
        </div>

        <!-- PHONEPE -->

        <div class="payment-card" onclick="payWithPhonePe()">

            <div class="logo phonepe-logo">
                P
            </div>

            <div class="payment-info">

                <h3>PhonePe</h3>

                <p>Pay securely using PhonePe</p>

            </div>

            <div class="arrow">
                ›
            </div>

        </div>

        <!-- PAYTM -->

        <div class="payment-card" onclick="payWithPaytm()">

            <div class="logo paytm-logo">
                Paytm
            </div>

            <div class="payment-info">

                <h3>Paytm</h3>

                <p>Pay securely using Paytm</p>

            </div>

            <div class="arrow">
                ›
            </div>

        </div>

        <div class="secure">
            🔒 Secure UPI Payment
        </div>

    </div>


    <!-- QR POPUP -->

    <div class="qr-overlay" id="qrOverlay">

        <div class="qr-box">

            <h2 id="qrTitle">
                Scan & Pay
            </h2>

            <p>
                Scan this QR code using any UPI app
            </p>

            <div id="qrcode"></div>

            <div class="upi-id" id="upiDisplay">
                UPI ID
            </div>

            <button class="copy-btn" onclick="copyUPI()">
                Copy UPI ID
            </button>

            <button class="close-btn" onclick="closeQR()">
                Close
            </button>

        </div>

    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


    <script>

        const UPI_ID = "YOUR_UPI_ID@upi";

        const MERCHANT_NAME = "Your Store";

        const AMOUNT = "500";


        document.getElementById("amountDisplay").innerText =
            "₹" + AMOUNT;

        document.getElementById("upiDisplay").innerText =
            UPI_ID;


        function createUPILink() {

            return "upi://pay" +
                "?pa=" + encodeURIComponent(UPI_ID) +
                "&pn=" + encodeURIComponent(MERCHANT_NAME) +
                "&am=" + encodeURIComponent(AMOUNT) +
                "&cu=INR";

        }


        function isMobile() {

            return /Android|iPhone|iPad|iPod/i.test(
                navigator.userAgent
            );

        }


        function payWithPhonePe() {

            if (isMobile()) {

                const upiLink = createUPILink();

                const phonePeLink =
                    "phonepe://pay?" +
                    upiLink.split("?")[1];

                window.location.href = phonePeLink;

                setTimeout(function () {

                    showQR("PhonePe Payment");

                }, 1500);

            } else {

                showQR("PhonePe Payment");

            }

        }


        function payWithPaytm() {

            if (isMobile()) {

                const upiLink = createUPILink();

                const paytmLink =
                    "paytmmp://pay?" +
                    upiLink.split("?")[1];

                window.location.href = paytmLink;

                setTimeout(function () {

                    showQR("Paytm Payment");

                }, 1500);

            } else {

                showQR("Paytm Payment");

            }

        }


        function showQR(title) {

            document.getElementById("qrTitle").innerText =
                title;

            document.getElementById("qrOverlay").style.display =
                "flex";

            document.getElementById("qrcode").innerHTML = "";

            new QRCode(
                document.getElementById("qrcode"),
                {
                    text: createUPILink(),
                    width: 220,
                    height: 220
                }
            );

        }


        function closeQR() {

            document.getElementById("qrOverlay").style.display =
                "none";

        }


        function copyUPI() {

            navigator.clipboard.writeText(UPI_ID);

            alert("UPI ID copied!");

        }

    </script>

</body>

</html>
