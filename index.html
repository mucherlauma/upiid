<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Payment</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f5fa;
        }

        .payment-box {
            width: 400px;
            max-width: 92%;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .payment-box h1 {
            color: #243b64;
            margin-bottom: 8px;
        }

        .payment-box p {
            color: #777;
            margin-bottom: 25px;
        }

        .amount {
            font-size: 32px;
            font-weight: bold;
            color: #222;
            margin-bottom: 25px;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px;
            margin: 15px 0;
            border: 2px solid #eee;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.3s;
            background: white;
        }

        .payment-option:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .payment-option img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .payment-option div {
            text-align: left;
        }

        .payment-option h3 {
            color: #222;
            margin-bottom: 5px;
        }

        .payment-option span {
            font-size: 13px;
            color: #777;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            display: none;
            font-size: 14px;
        }

        .error {
            background: #ffe8e8;
            color: #c62828;
        }

        .qr-popup {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .qr-box {
            background: white;
            width: 340px;
            max-width: 90%;
            padding: 25px;
            border-radius: 18px;
            text-align: center;
        }

        .qr-box h2 {
            margin-bottom: 8px;
            color: #243b64;
        }

        .qr-box p {
            color: #666;
            font-size: 14px;
            margin-bottom: 18px;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }

        .close-btn {
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 10px;
            background: #243b64;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .close-btn:hover {
            background: #172b4d;
        }

        @media (max-width: 500px) {
            .payment-box {
                padding: 22px;
            }

            .amount {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="payment-box">

        <h1>Make Payment</h1>
        <p>Choose your preferred payment app</p>

        <div class="amount" id="amount">
            ₹0
        </div>

        <div class="payment-option" onclick="payWithPhonePe()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/71/PhonePe_Logo.svg" alt="PhonePe">

            <div>
                <h3>PhonePe</h3>
                <span>Pay using PhonePe</span>
            </div>
        </div>

        <div class="payment-option" onclick="payWithPaytm()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/42/Paytm_logo.png" alt="Paytm">

            <div>
                <h3>Paytm</h3>
                <span>Pay using Paytm</span>
            </div>
        </div>

        <div id="status" class="status"></div>

    </div>


    <div class="qr-popup" id="qrPopup">

        <div class="qr-box">

            <h2>Scan & Pay</h2>

            <p>Scan this QR code using any UPI app</p>

            <div id="qrcode"></div>

            <button class="close-btn" onclick="closeQR()">
                Close
            </button>

        </div>

    </div>


    <script>

        let UPI_ID = "";
        let MERCHANT_NAME = "";
        let AMOUNT = "";

        async function loadPaymentConfig() {

            try {

                const response = await fetch("/api/payment-config");

                if (!response.ok) {
                    throw new Error("Payment configuration failed");
                }

                const data = await response.json();

                UPI_ID = data.upiId;
                MERCHANT_NAME = data.merchantName;
                AMOUNT = data.amount;

                document.getElementById("amount").innerText = "₹" + AMOUNT;

            } catch (error) {

                showError("Payment configuration load avvaledu. Please try again.");

            }
        }


        function createUPILink() {

            return "upi://pay" +
                "?pa=" + encodeURIComponent(UPI_ID) +
                "&pn=" + encodeURIComponent(MERCHANT_NAME) +
                "&am=" + encodeURIComponent(AMOUNT) +
                "&cu=INR";

        }


        function isMobile() {

            return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        }


        function payWithPhonePe() {

            if (!UPI_ID) {
                showError("Payment details loading... Please wait.");
                return;
            }

            const upiLink = createUPILink();

            if (isMobile()) {

                window.location.href =
                    "phonepe://pay" +
                    "?pa=" + encodeURIComponent(UPI_ID) +
                    "&pn=" + encodeURIComponent(MERCHANT_NAME) +
                    "&am=" + encodeURIComponent(AMOUNT) +
                    "&cu=INR";

            } else {

                showQR(upiLink);

            }
        }


        function payWithPaytm() {

            if (!UPI_ID) {
                showError("Payment details loading... Please wait.");
                return;
            }

            const upiLink = createUPILink();

            if (isMobile()) {

                window.location.href =
                    "paytmmp://pay" +
                    "?pa=" + encodeURIComponent(UPI_ID) +
                    "&pn=" + encodeURIComponent(MERCHANT_NAME) +
                    "&am=" + encodeURIComponent(AMOUNT) +
                    "&cu=INR";

            } else {

                showQR(upiLink);

            }
        }


        function showQR(upiLink) {

            document.getElementById("qrcode").innerHTML = "";

            new QRCode(document.getElementById("qrcode"), {
                text: upiLink,
                width: 220,
                height: 220
            });

            document.getElementById("qrPopup").style.display = "flex";

        }


        function closeQR() {

            document.getElementById("qrPopup").style.display = "none";

        }


        function showError(message) {

            const status = document.getElementById("status");

            status.innerText = message;
            status.className = "status error";
            status.style.display = "block";

        }


        loadPaymentConfig();

    </script>

</body>
</html>
